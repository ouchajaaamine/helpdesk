# User Management Service
# This replaces user-service from docker-compose.yml
# Handles user CRUD operations and authentication integration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1  # Start with 1, can scale later
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # Image pull secret for GitLab Registry authentication
      imagePullSecrets:
      - name: gitlab-registry-secret  # Secret containing GitLab credentials
      containers:
      - name: user-service
        image: registry.gitlab.com/ouchajaaamine/helpdesk/user-service:latest  # GitLab Registry image
        ports:
        - containerPort: 8081  # User service port
        imagePullPolicy: Always  # Always pull from GitLab Registry
        env:
        # DATABASE CONNECTION - Updated for Kubernetes DNS
        # Old: jdbc:postgresql://postgres-db:5432/userdb
        # New: jdbc:postgresql://postgres-user-db:5432/userdb
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-user-db:5432/userdb"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "password"
        
        # EUREKA SERVICE DISCOVERY - Using DNS name
        # Old: http://172.20.0.10:8761/eureka/
        # New: http://discovery-service:8761/eureka/
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          value: "http://discovery-service:8761/eureka/"
        
        # KEYCLOAK AUTHENTICATION - Using DNS name
        # Old: http://keycloak:8080 (already using service name)
        # New: Same, but ensuring it's documented
        - name: KEYCLOAK_AUTH_SERVER_URL
          value: "http://keycloak:8080"
        
        # SERVICE REGISTRATION - Tell Eureka our hostname
        - name: EUREKA_INSTANCE_HOSTNAME
          value: "user-service"
        - name: SPRING_APPLICATION_NAME
          value: "user-service"
        
        # Health check: Is service ready to handle requests?
        # readinessProbe:
        #   httpGet:
        #     path: /actuator/health
        #     port: 8081
        #   initialDelaySeconds: 45  # Spring Boot + DB connection takes time
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        
        # Health check: Is service still alive?
        # livenessProbe:
        #   httpGet:
        #     path: /actuator/health
        #     port: 8081
        #   initialDelaySeconds: 60  # Give more time for full startup
        #   periodSeconds: 30
        #   timeoutSeconds: 10
      
      # Init containers: Wait for all dependencies before starting
      # This replaces docker-compose depends_on functionality
      initContainers:
      # Wait for PostgreSQL database to be ready
      - name: wait-for-postgres
        image: postgres:15
        command: ['sh', '-c', 'until pg_isready -h postgres-user-db -p 5432 -U postgres; do echo waiting for postgres-user-db; sleep 2; done;']
      
      # Wait for Eureka Discovery Service to be ready
      - name: wait-for-discovery
        image: busybox:1.28
        command: ['sh', '-c', 'until nslookup discovery-service; do echo waiting for discovery-service; sleep 2; done;']
---
# Service: Makes user-service accessible internally and externally
apiVersion: v1
kind: Service
metadata:
  name: user-service  # DNS name within cluster
spec:
  selector:
    app: user-service
  ports:
  - protocol: TCP
    port: 8081        # Port exposed to other services
    targetPort: 8081  # Port on user-service container
    nodePort: 30081   # External port (replaces 8081:8081 from docker-compose)
  type: NodePort      # Expose externally for testing