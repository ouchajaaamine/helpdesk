apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-config
  labels:
    app: grafana
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: "15s"
        secureJsonData: {}