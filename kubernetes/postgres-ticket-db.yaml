# PostgreSQL Database for Ticket Service
# This replaces postgres-ticket from docker-compose.yml
# Uses PersistentVolumeClaim to keep data when pod restarts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-ticket-pvc
spec:
  accessModes:
    - ReadWriteOnce  # Single pod can read/write
  resources:
    requests:
      storage: 1Gi   # 1GB storage (adjust as needed)
---
# Deployment for PostgreSQL Ticket Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ticket-db
  labels:
    app: postgres-ticket-db
spec:
  replicas: 1  # Database should have exactly 1 replica
  selector:
    matchLabels:
      app: postgres-ticket-db
  template:
    metadata:
      labels:
        app: postgres-ticket-db
    spec:
      containers:
      - name: postgres
        image: postgres:15  # Same as docker-compose
        ports:
        - containerPort: 5432  # PostgreSQL default port
        env:
        # Database configuration (same as docker-compose environment)
        - name: POSTGRES_DB
          value: "ticketdb"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        # Mount persistent volume to keep data
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        # Health check: Is PostgreSQL ready?
        # readinessProbe:
        #   exec:
        #     command:
        #       - pg_isready
        #       - -U
        #       - postgres
        #   initialDelaySeconds: 10
        #   periodSeconds: 5
        #   timeoutSeconds: 5  # Increased timeout
        #   failureThreshold: 5
        # Health check: Is PostgreSQL still running?
        # livenessProbe:
        #   exec:
        #     command:
        #       - pg_isready
        #       - -U
        #       - postgres
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        #   timeoutSeconds: 5  # Increased timeout
        #   failureThreshold: 3
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-ticket-pvc  # Use the PVC we created above
---
# Service: Makes postgres accessible at postgres-ticket-db:5432
apiVersion: v1
kind: Service
metadata:
  name: postgres-ticket-db  # DNS name for ticket service to connect
spec:
  selector:
    app: postgres-ticket-db
  ports:
  - protocol: TCP
    port: 5432        # Port exposed to other services
    targetPort: 5432  # Port on PostgreSQL container
  type: ClusterIP     # Internal only (no external access needed)