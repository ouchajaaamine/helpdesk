# ===== SONARCLOUD CODE QUALITY ANALYSIS =====

# 🔍 Analyze discovery-service code quality
sonar-discovery-service:
  stage: test
  image: maven:3.9.4-eclipse-temurin-21
  dependencies:
    - build-discovery-service
  needs: ["build-discovery-service"]
  script:
    - echo " Running SonarCloud analysis for discovery-service..."
    - cd backend/discovery-service
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar
      -Dsonar.projectKey=ouchajaaamine_helpdesk-discovery
      -Dsonar.projectName="Helpdesk - Discovery Service"
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
  allow_failure: true  # Don't block pipeline initially (learning mode)
  only:
    - main
    - develop

