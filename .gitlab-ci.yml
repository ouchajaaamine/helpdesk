# Minimal pipeline for testing deployment stage only
# Usage: Rename this to .gitlab-ci.yml temporarily to test deploy stage

stages:
  - deploy

variables:
  # Use existing images from registry (skip building)
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"

# Deploy microservices to Azure VM using production docker-compose configuration
# This assumes images are already available in GitLab Registry
deploy-to-azure-vm:
  stage: deploy
  image: alpine:latest
  before_script:
    # Install SSH client and other tools
    - apk add --no-cache openssh-client curl
    # Setup SSH directory
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Clean and decode SSH key (remove spaces, newlines, carriage returns)
    - echo "$AZURE_VM_SSH_KEY" | tr -d ' \n\r\t' | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Debug: Check key file
    - ls -lh ~/.ssh/id_rsa
    - echo "First bytes of key file:"
    - xxd -l 32 ~/.ssh/id_rsa || head -c 32 ~/.ssh/id_rsa | od -A x -t x1z -v
    # Add host to known_hosts (disable host key checking for simplicity)
    - mkdir -p ~/.ssh
    - echo "StrictHostKeyChecking no" > ~/.ssh/config
    - echo "UserKnownHostsFile=/dev/null" >> ~/.ssh/config
    # Test SSH connection (using key file directly without ssh-agent)
    - echo "Testing SSH connection to $AZURE_VM_USER@$AZURE_VM_IP..."
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "echo 'SSH connection successful!' && whoami"
  script:
    - echo "Deploying helpdesk microservices to Azure VM at $AZURE_VM_IP"
    - echo "Transferring docker-compose.prod.yml to VM"
    - scp -i ~/.ssh/id_rsa docker-compose.prod.yml $AZURE_VM_USER@$AZURE_VM_IP:$DEPLOY_PATH/
    - echo "Transferring deployment scripts and configuration"
    - scp -i ~/.ssh/id_rsa setup-keycloak-realm.sh $AZURE_VM_USER@$AZURE_VM_IP:$DEPLOY_PATH/ || true
    - scp -i ~/.ssh/id_rsa -r keycloak-import $AZURE_VM_USER@$AZURE_VM_IP:$DEPLOY_PATH/ || true
    - echo "Connecting to VM and executing deployment commands"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && echo 'Starting deployment process'"
    - echo "Login to GitLab Registry on VM"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    - echo "Stop existing services"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml down || true"
    - echo "Clean up old images"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "docker image prune -f || true"
    - echo "Pull latest images"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml pull"
    - echo "Start services"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml up -d"
    - echo "Wait for services to start"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "sleep 30"
    - echo "Show container status"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "docker ps"
    - echo "Start services"
    - ssh $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml up -d"
    - echo "Wait for services to start"
    - ssh $AZURE_VM_USER@$AZURE_VM_IP "sleep 30"
    - echo "Show container status"
    - ssh $AZURE_VM_USER@$AZURE_VM_IP "docker ps"
    - echo "Verifying deployment status"
    - sleep 10
    - echo "Testing Gateway health endpoint"
    - curl -f http://$AZURE_VM_IP:8080/actuator/health || true
    - echo "Testing Keycloak availability"
    - curl -f http://$AZURE_VM_IP:8180 || true
    - echo "Deployment verification completed"
    - echo "Services are available at Gateway API http://$AZURE_VM_IP:8080"
    - echo "Keycloak Admin http://$AZURE_VM_IP:8180"
    - echo "Eureka Dashboard http://$AZURE_VM_IP:8761"
  environment:
    name: production
    url: http://$AZURE_VM_IP:8080
  only:
    - main
  # Remove manual trigger for testing
  when: on_success