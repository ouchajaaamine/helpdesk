# Define pipeline stages.
stages:
  - build
  - test
  - docker_build
  - deploy

# Global variables for all jobs.
variables:
  # Maven JVM options for caching and CI environment.
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # Maven CLI options for CI-friendly builds.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  # Docker-in-Docker host.
  DOCKER_HOST: "tcp://docker:2375"
  # Disable Docker TLS for simplicity in CI.
  DOCKER_TLS_CERTDIR: ""

# Cache Maven dependencies.
cache:
  # Unique cache key per branch.
  key: ${CI_COMMIT_REF_SLUG}
  # Path to cache Maven repository.
  paths:
    - .m2/repository

# Job to build the discovery-service.
build-discovery-service:
  # Assign this job to the 'build' stage.
  stage: build
  # Use a specific Docker image for Maven builds.
  image: maven:3.8.7-openjdk-17
  # Define the commands to execute for this job.
  script:
    # Navigate to the discovery-service directory.
    - cd backend/discovery-service
    # Execute Maven clean install to build the service.
    - mvn $MAVEN_CLI_OPTS clean install
  # Specify artifacts to save from this job.
  artifacts:
    paths:
      # Save the generated JAR file.
      - backend/discovery-service/target/*.jar
    # Define when artifacts expire (e.g., after 1 week).
    expire_in: 1 week

# Job to test the discovery-service.
test-discovery-service:
  stage: test
  image: maven:3.8.7-openjdk-17
  # Dependencies: Fetch the JAR artifact from the build stage.
  dependencies:
    - build-discovery-service
  script:
    - cd backend/discovery-service
    - mvn $MAVEN_CLI_OPTS test
  # Only run if the build stage passed.
  needs: ["build-discovery-service"]

# Job to build and push Docker image for discovery-service.
docker_build-discovery-service:
  stage: docker_build # Assign to docker_build stage.
  image: docker:latest # Use Docker client image.
  services:
    - docker:dind # Enable Docker-in-Docker.
  dependencies:
    - test-discovery-service # Requires test artifacts.
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY # Login to registry.
    - docker build -t $CI_REGISTRY_IMAGE/discovery-service:$CI_COMMIT_SHORT_SHA backend/discovery-service # Build image.
    - docker push $CI_REGISTRY_IMAGE/discovery-service:$CI_COMMIT_SHORT_SHA # Push image to registry.
  needs: ["test-discovery-service"] # Only run if test stage passed.