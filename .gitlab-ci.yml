# =====================================================
# DEPLOYMENT STAGE - AZURE VM DEPLOYMENT
# =====================================================

# Deploy microservices to Azure VM using production docker-compose configuration
# Pulls images from GitLab Registry and deploys via SSH to Azure VM
deploy-to-azure-vm:
  stage: deploy
  image: alpine:latest
  dependencies:
    - docker_push-discovery-service
    - docker_push-gateway-service
    - docker_push-user-service
    - docker_push-ticket-service
  needs:
    - docker_push-discovery-service
    - docker_push-gateway-service
    - docker_push-user-service
    - docker_push-ticket-service
  before_script:
    # Install required packages for deployment
    - apk add --no-cache openssh-client curl
    # Create SSH directory with secure permissions
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Decode base64 SSH key and save to file
    - echo "$AZURE_VM_SSH_KEY" | tr -d ' \n\r\t' | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # Configure SSH to skip host key verification in CI environment
    - echo "StrictHostKeyChecking no" > ~/.ssh/config
    - echo "UserKnownHostsFile=/dev/null" >> ~/.ssh/config
    # Verify SSH connection to Azure VM
    - echo "Testing SSH connection to $AZURE_VM_USER@$AZURE_VM_IP..."
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "echo 'Connection successful' && whoami"
  script:
    # Transfer production configuration files to Azure VM
    - echo "Deploying helpdesk microservices to Azure VM at $AZURE_VM_IP"
    - echo "Transferring docker-compose.prod.yml to VM"
    - scp -i ~/.ssh/id_rsa docker-compose.prod.yml $AZURE_VM_USER@$AZURE_VM_IP:$DEPLOY_PATH/
    - echo "Transferring deployment scripts and configuration"
    - scp -i ~/.ssh/id_rsa setup-keycloak-realm.sh $AZURE_VM_USER@$AZURE_VM_IP:$DEPLOY_PATH/ || true
    - scp -i ~/.ssh/id_rsa -r keycloak-import $AZURE_VM_USER@$AZURE_VM_IP:$DEPLOY_PATH/ || true
    
    # Execute deployment commands on Azure VM via SSH
    - echo "Connecting to VM and executing deployment commands"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && echo 'Starting deployment process'"
    
    # Authenticate Docker with GitLab Registry
    - echo "Login to GitLab Registry on VM"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY"
    
    # Stop existing containers and clean up
    - echo "Stop existing services"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml down || true"
    - echo "Clean up old images"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "docker image prune -f || true"
    
    # Pull latest images from GitLab Registry
    - echo "Pull latest images"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml pull"
    
    # Start services with docker-compose
    - echo "Start services"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml up -d"
    
    # Wait for services to initialize
    - echo "Wait for services to start"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "sleep 30"
    
    # Display running containers
    - echo "Show container status"
    - ssh -i ~/.ssh/id_rsa $AZURE_VM_USER@$AZURE_VM_IP "docker ps"
    
    # Verify deployment health
    - echo "Verifying deployment status"
    - sleep 10
    - echo "Testing Gateway health endpoint"
    - curl -f http://$AZURE_VM_IP:8080/actuator/health || true
    - echo "Testing Keycloak availability"
    - curl -f http://$AZURE_VM_IP:8180 || true
    
    # Display deployment summary
    - echo "Deployment verification completed"
    - echo "Services are available at Gateway API http://$AZURE_VM_IP:8080"
    - echo "Keycloak Admin http://$AZURE_VM_IP:8180"
    - echo "Eureka Dashboard http://$AZURE_VM_IP:8761"
    
  environment:
    name: production
    url: http://$AZURE_VM_IP:8080
  only:
    - main
  when: manual  # Require manual trigger for safety

# =====================================================
# KUBERNETES DEPLOYMENT STAGE - LOCAL K8S CLUSTER
# =====================================================

# Deploy microservices to local Kubernetes cluster (Minikube/Kind)
# This job is triggered only for k8s-local branch
deploy-to-k8s-local:
  stage: deploy
  image: 
    name: bitnami/kubectl:latest
    entrypoint: ['']
  dependencies:
    - docker_push-discovery-service
    - docker_push-gateway-service
    - docker_push-user-service
    - docker_push-ticket-service
  needs:
    - docker_push-discovery-service
    - docker_push-gateway-service
    - docker_push-user-service
    - docker_push-ticket-service
  before_script:
    # Verify kubectl is available
    - kubectl version --client
    # Configure kubectl to connect to your local cluster
    # Option 1: Using KUBECONFIG file stored in GitLab CI/CD variables
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    # Verify connection to cluster
    - echo "Testing connection to Kubernetes cluster..."
    - kubectl cluster-info
    - kubectl get nodes
  script:
    # Create GitLab Registry secret if it doesn't exist
    - echo "Setting up GitLab Registry authentication in Kubernetes..."
    - kubectl create secret docker-registry gitlab-registry-secret 
        --docker-server=$CI_REGISTRY 
        --docker-username=$CI_REGISTRY_USER 
        --docker-password=$CI_REGISTRY_PASSWORD 
        --docker-email=$GITLAB_USER_EMAIL 
        --dry-run=client -o yaml | kubectl apply -f -
    
    # Deploy infrastructure services first (databases, discovery)
    - echo "Deploying infrastructure services..."
    - kubectl apply -f kubernetes/postgres-user-db.yaml
    - kubectl apply -f kubernetes/postgres-ticket-db.yaml
    - kubectl apply -f kubernetes/discovery-service.yaml
    
    # Wait for infrastructure to be ready
    - echo "Waiting for infrastructure services to be ready..."
    - kubectl wait --for=condition=ready pod -l app=postgres-user-db --timeout=120s || true
    - kubectl wait --for=condition=ready pod -l app=postgres-ticket-db --timeout=120s || true
    - kubectl wait --for=condition=ready pod -l app=discovery-service --timeout=120s || true
    
    # Deploy Keycloak
    - echo "Deploying Keycloak authentication service..."
    - kubectl apply -f kubernetes/keycloak.yaml
    
    # Deploy application services
    - echo "Deploying application services..."
    - kubectl apply -f kubernetes/gateway-service.yaml
    - kubectl apply -f kubernetes/user-service.yaml
    - kubectl apply -f kubernetes/ticket-service.yaml
    
    # Wait for application services to be ready
    - echo "Waiting for application services to be ready..."
    - sleep 30
    - kubectl wait --for=condition=ready pod -l app=gateway-service --timeout=120s || true
    - kubectl wait --for=condition=ready pod -l app=user-service --timeout=120s || true
    - kubectl wait --for=condition=ready pod -l app=ticket-service --timeout=120s || true
    
    # Display deployment status
    - echo "==================================="
    - echo "Kubernetes Deployment Summary"
    - echo "==================================="
    - kubectl get deployments
    - kubectl get pods
    - kubectl get services
    
    # Get Minikube IP and service URLs
    - echo "==================================="
    - echo "Service Access URLs"
    - echo "==================================="
    - echo "Get your Minikube IP with - minikube ip"
    - echo "Eureka Dashboard - http://MINIKUBE_IP:30761"
    - echo "API Gateway - http://MINIKUBE_IP:30080"
    - echo "Keycloak Admin - http://MINIKUBE_IP:30180"
    - echo "User Service - http://MINIKUBE_IP:30081"
    - echo "Ticket Service - http://MINIKUBE_IP:30082"
    
  environment:
    name: k8s-local
    url: http://localhost:30080
  only:
    - k8s-local
  when: manual  # Require manual trigger for safety
