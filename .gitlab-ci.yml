# MINIMAL CI/CD FOR K8S DEPLOYMENT TESTING ONLY
# Full pipeline backed up in .gitlab-ci.yml.backup
# To restore full pipeline: Copy-Item .gitlab-ci.yml.backup .gitlab-ci.yml -Force

stages:
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

test-deploy-to-k8s:
  stage: deploy
  image: 
    name: bitnami/kubectl:latest
    entrypoint: [""]
  dependencies: []
  needs: []
  before_script:
    - echo "=== K8S DEPLOYMENT TEST ==="
    - kubectl version --client
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config || echo "No KUBE_CONFIG variable set"
    - chmod 600 ~/.kube/config 2>/dev/null || true
  script:
    - echo "Testing cluster connection..."
    - kubectl cluster-info || echo "Cannot connect to cluster"
    - kubectl get nodes || echo "Cannot get nodes"
    - echo ""
    - echo "Kubernetes manifests available:"
    - ls -la kubernetes/ || echo "No kubernetes directory"
    - echo ""
    - echo "SUCCESS K8s deployment stage test completed"
    - echo "To deploy locally, run ./deploy-k8s-local.ps1"
  environment:
    name: k8s-local-test
  only:
    - k8s-local
  when: manual
  allow_failure: true