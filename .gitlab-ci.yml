# MINIMAL CI/CD FOR K8S DEPLOYMENT TESTING ONLY
# Full pipeline backed up in .gitlab-ci.yml.backup
# To restore full pipeline: Copy-Item .gitlab-ci.yml.backup .gitlab-ci.yml -Force

stages:
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

test-deploy-to-k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  dependencies: []
  needs: []
  before_script:
    - echo "=== K8S DEPLOYMENT TEST ==="
    - kubectl version --client
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
  script:
    - echo "Testing cluster connection..."
    - kubectl cluster-info || echo "Cannot connect (expected for local Minikube)"
    - kubectl get nodes || echo "Cannot get nodes"
    - echo ""
    - echo "Kubernetes manifests:"
    - ls -la kubernetes/
    - echo ""
    - echo "If cluster was accessible, would deploy 7 services"
    - echo "Use .\deploy-k8s-local.ps1 to deploy locally"
  environment:
    name: k8s-local-test
  only:
    - k8s-local
  when: manual
  allow_failure: true
