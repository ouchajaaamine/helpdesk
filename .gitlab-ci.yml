# Define pipeline stages
stages:
  - build
  - test
  - docker_build
  - deploy

# Global variables for all jobs
variables:
  # Maven JVM options - aligned with cache path
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # Maven CLI options for CI-friendly builds
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
  # Docker configuration
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

# Cache Maven dependencies - Fixed path alignment
cache:
  key: "$CI_COMMIT_REF_SLUG-maven"
  paths:
    - .m2/repository/
  policy: pull-push

# Job to build the discovery-service
build-discovery-service:
  stage: build
  image: maven:3.9.4-eclipse-temurin-21
  script:
    - echo "Building discovery-service..."
    - cd backend/discovery-service
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - backend/discovery-service/target/*.jar
  retry: 
    max: 2

# Job to test the discovery-service
test-discovery-service:
  stage: test
  image: maven:3.9.4-eclipse-temurin-21
  dependencies:
    - build-discovery-service
  script:
    - echo "Testing discovery-service..."
    - cd backend/discovery-service
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    reports:
      junit:
        - backend/discovery-service/target/surefire-reports/TEST-*.xml

# Job to build and push Docker image for discovery-service
docker_build-discovery-service:
  stage: docker_build
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - test-discovery-service
  script:
    - echo "Building Docker image for discovery-service..."
    - cd backend/discovery-service
    - docker build -t discovery-service:$CI_COMMIT_SHA .
    - echo "Docker image built successfully"