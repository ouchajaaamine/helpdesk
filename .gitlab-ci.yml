# ===== TRIVY SECURITY SCANNING STAGE =====

# Security scan discovery-service Docker image
trivy-discovery-service:
  stage: security_scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  services:
    - docker:dind
  dependencies:
    - docker_build-discovery-service
  needs: ["docker_build-discovery-service"]
  variables:
    # Trivy configuration for CI environment
    TRIVY_NO_PROGRESS: "true"                        # Disable progress bar for CI logs
    TRIVY_CACHE_DIR: "${CI_PROJECT_DIR}/.trivy/cache" # Cache vulnerability database
    TRIVY_TIMEOUT: "10m"                             # Set scan timeout to 10 minutes
  script:
    - echo "Running Trivy security scan for discovery-service..."
    - echo "Scanning tar file discovery-service-image.tar"
    - trivy image --download-db-only
    - trivy image --format sarif --output discovery-service-trivy.sarif --severity CRITICAL,HIGH --exit-code 0 --input discovery-service-image.tar
    - trivy image --format table --severity CRITICAL,HIGH,MEDIUM --input discovery-service-image.tar
    - echo "Security scan completed - check artifacts for detailed report"
  artifacts:
    reports:
      sast: discovery-service-trivy.sarif
    paths:
      - discovery-service-trivy.sarif
    expire_in: 1 week
  cache:
    key: trivy-cache
    paths:
      - .trivy/cache
  allow_failure: true  # Learning mode: don't block pipeline, just report
  only:
    - main
    - develop

