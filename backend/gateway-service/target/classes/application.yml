server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service-api-docs
          uri: http://user-service:8081
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /api-docs
        - id: ticket-service-api-docs
          uri: http://ticket-service:8082
          predicates:
            - Path=/v3/api-docs/ticket-service
          filters:
            - RewritePath=/v3/api-docs/ticket-service, /api-docs
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        - id: user-service-admin
          uri: http://user-service:8081
          predicates:
            - Path=/api/admin/**
        - id: ticket-service
          uri: http://ticket-service:8082
          predicates:
            - Path=/api/tickets/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: gateway-service

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: ticket-service
        url: /v3/api-docs/ticket-service

# Disable unnecessary features for simplicity
logging:
  level:
    '[org.springframework.cloud.gateway]': DEBUG
    '[org.springframework.cloud.loadbalancer]': DEBUG
    '[com.netflix.discovery]': DEBUG

# Enable Prometheus metrics endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true