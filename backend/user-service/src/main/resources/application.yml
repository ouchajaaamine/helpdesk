server:
    port: 8081

spring:
    application:
        name: user-service
    datasource:
        url: jdbc:postgresql://postgres-db:5432/userdb
        username: postgres
        password: password
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        defer-datasource-initialization: true
        properties:
            hibernate:
                '[format_sql]': true
                dialect: org.hibernate.dialect.PostgreSQLDialect
    sql:
        init:
            mode: always
            continue-on-error: true
    
    # 🔐 KEYCLOAK OAUTH2 CONFIGURATION
    security:
        oauth2:
            resourceserver:
                jwt:
                    # Keycloak JWT token validation endpoint
                    issuer-uri: http://localhost:8180/realms/helpdesk-system
                    # JWK Set URI for validating JWT signatures
                    jwk-set-uri: http://host.docker.internal:8180/realms/helpdesk-system/protocol/openid-connect/certs
    
    mail:
        host: smtp.gmail.com
        port: 587
        username: ouchajaaamine@gmail.com  # Replace with your actual Gmail
        password: uoda cjbb srso klnv    # Replace with Gmail App Password
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                    ssl:
                        enable: false

eureka:
    client:
        serviceUrl:
            defaultZone: http://discovery-service:8761/eureka/
        fetch-registry: true
        register-with-eureka: true
    instance:
        hostname: localhost

logging:
    level:
        '[org.springframework]': INFO
        '[com.helpdesk.userservice]': DEBUG

